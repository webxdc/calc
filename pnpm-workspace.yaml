allowBuilds:
  core-js: false

# Two things at once here.
#
# 1. pkg-xlsx instead of pkg: the xlsx reader/writer is gated behind the
#    wasm crate's `xlsx` feature, so upstream emits two packages. The default
#    one has no `toXlsx`, which the export button needs.
# 2. `link:` instead of `file:`: a `file:` install uses npm-pack semantics and
#    drops the wasm-bindgen `snippets/` dir, after which the build cannot
#    resolve ./snippets/.../inline0.js. Linking keeps every file present.
overrides:
  "@ironcalc/wasm": "link:vendor/ironcalc/bindings/wasm/pkg-xlsx"
